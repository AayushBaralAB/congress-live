<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NC 15th Mahadhiveshan – Premium Live Results</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<script src="candidates.js"></script>
<style>
:root{--gold:#f5b301;--gold2:#ffd34d;--navy:#070d24;--mut:#9aa7d0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#000;font-family:'Noto Sans Devanagari',sans-serif;overflow:hidden}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
#stage{width:1920px;height:1080px;flex-shrink:0;transform-origin:center center;background:radial-gradient(1000px 500px at 15% 0%,rgba(245,179,1,.14),transparent 60%),radial-gradient(900px 500px at 90% 10%,rgba(43,75,216,.35),transparent 60%),linear-gradient(180deg,#0a1330,#070d24);color:#f2f5ff;display:flex;flex-direction:column;position:relative;overflow:hidden}
/* ambient FX */
#fx{position:absolute;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(140px);opacity:.5}
.blob.b1{width:700px;height:700px;left:-200px;top:-240px;background:#22378f;animation:drift1 14s ease-in-out infinite alternate}
.blob.b2{width:620px;height:620px;right:-180px;top:-200px;background:#0a5a34;animation:drift2 18s ease-in-out infinite alternate}
.blob.b3{width:460px;height:460px;left:38%;top:-320px;background:#f5b301;opacity:.16;animation:drift1 22s ease-in-out infinite alternate-reverse}
@keyframes drift1{to{transform:translate(120px,60px) scale(1.12)}}
@keyframes drift2{to{transform:translate(-120px,80px) scale(1.08)}}
.sp{position:absolute;border-radius:50%;animation:floatUp linear infinite}
@keyframes floatUp{from{transform:translateY(250px);opacity:0}10%{opacity:.8}to{transform:translateY(-1150px);opacity:0}}
#goldline{position:absolute;top:0;left:0;right:0;height:6px;z-index:2;background:linear-gradient(90deg,#d21f26,#f5f5f5,#0a7a3d,#f5b301,#d21f26);background-size:200% 100%;animation:lineFlow 8s linear infinite}
@keyframes lineFlow{to{background-position:200% 0}}
#top,#catbar,#list,#ticker,#bottom{position:relative;z-index:1}
/* HEADER */
#top{height:124px;display:flex;align-items:center;gap:20px;padding:14px 48px}
#logo{width:76px;height:76px;background:linear-gradient(135deg,#fff,#ffe9a8);border:3px solid var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:44px;flex-shrink:0;box-shadow:0 0 26px rgba(245,179,1,.55);animation:logoGlow 2.4s ease-in-out infinite alternate}
@keyframes logoGlow{to{box-shadow:0 0 46px rgba(245,179,1,.9)}}
#top h1{font-size:42px;font-weight:800;line-height:1.05;letter-spacing:.3px}
#top h1 em{font-style:normal;color:var(--gold)}
#top p{font-size:20px;color:var(--mut);font-weight:600}
#liveBox{margin-left:auto;text-align:right}
#liveBadge{background:linear-gradient(180deg,#ef4444,#b3121a);font-weight:800;font-size:30px;padding:7px 26px;border-radius:999px;display:inline-flex;align-items:center;gap:10px;border:2px solid #ff8a8a;box-shadow:0 0 20px rgba(239,68,68,.7);animation:pulse 1.6s infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
#liveBadge i{width:16px;height:16px;background:#fff;border-radius:50%;display:inline-block;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
#slideNo{font-size:24px;font-weight:700;margin-top:6px;color:#dbe3ff}
/* CATEGORY BANNER */
#catbar{margin:8px 48px 0;display:flex;align-items:center;gap:20px}
#catTx{flex:1;min-width:0}
#catOver{font-size:19px;font-weight:800;letter-spacing:3px;color:var(--gold)}
#catbar h2{font-size:42px;font-weight:800;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:titleIn .5s ease both}
@keyframes titleIn{from{opacity:0;transform:translateX(-50px)}}
#catU{height:5px;margin-top:6px;border-radius:99px;background:linear-gradient(90deg,var(--gold),transparent);transform-origin:left;animation:uGrow .7s ease both}
@keyframes uGrow{from{transform:scaleX(0)}}
.pill{font-size:20px;font-weight:800;padding:7px 20px;border-radius:999px;white-space:nowrap;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.2);backdrop-filter:blur(4px)}
.pill.seat{color:#7dffb0;border-color:#22c55e}
.pill.cand{color:#bcd0ff;border-color:#5b8cff}
.pill.vote{color:#ffb3b3;border-color:#ef4444;animation:pulse 2s infinite}
.pill.cast{color:#ffe9a8;border-color:var(--gold)}
/* LIST */
#list{flex:1;margin:12px 48px 0;display:flex;flex-direction:column;gap:10px;justify-content:flex-start;min-height:0}
.row{background:linear-gradient(180deg,rgba(26,36,76,.96),rgba(13,19,44,.96));border:2px solid rgba(255,255,255,.09);border-radius:18px;display:flex;align-items:center;gap:20px;padding:10px 24px 10px 12px;position:relative;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.45);animation:rowIn .55s cubic-bezier(.2,.9,.25,1.15) both;animation-delay:var(--d,0ms)}
@keyframes rowIn{from{opacity:0;transform:translateX(90px) scale(.97)}}
.row.lead{border-color:var(--gold);box-shadow:0 0 22px rgba(245,179,1,.35)}
.row .rank{min-width:68px;height:68px;border-radius:50%;background:#0a1330;border:2px solid rgba(255,255,255,.25);color:#fff;font-size:32px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.row.lead .rank{border-color:var(--gold);color:var(--gold2)}
.row img,.row .av{width:78px;height:78px;border-radius:50%;object-fit:cover;background:#2a3a72;flex-shrink:0;border:3px solid rgba(255,255,255,.2)}
.row.lead img,.row.lead .av{border-color:var(--gold)}
.row .av{display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:800;color:#fff;background:linear-gradient(135deg,#3b5bff,#0a7a3d)}
.row .nm{flex:1;min-width:0}
.row .nm b{font-size:31px;font-weight:800;line-height:1.15;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv{font-size:21px;font-weight:800;margin-left:10px}
.mv.up{color:#22c55e}.mv.dn{color:#ef4444}.mv.same{color:#5b6a99}
.row .bar{position:absolute;left:0;bottom:0;height:8px;background:rgba(255,255,255,.08);width:100%}
.row .bar i{display:block;height:100%;width:var(--w,0%);background:linear-gradient(90deg,#3b82f6,#93c5fd);animation:barGrow 1.1s ease both}
.row.lead .bar i{background:linear-gradient(90deg,#f5b301,#22c55e)}
@keyframes barGrow{from{width:0}}
.row .vt{text-align:right;min-width:205px}
.row .vt b{font-size:44px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.row.lead .vt b{color:var(--gold2);text-shadow:0 0 18px rgba(245,179,1,.5)}
.row .vt span{font-size:19px;color:var(--mut);font-weight:700}
.winTag{font-size:19px;font-weight:800;background:rgba(245,179,1,.15);color:var(--gold2);border:2px solid var(--gold);border-radius:999px;padding:2px 14px;margin-left:12px;vertical-align:middle;white-space:nowrap}
/* WINNER */
.row.won{border-color:var(--gold);background:linear-gradient(90deg,rgba(80,58,0,.92),rgba(40,30,2,.94));box-shadow:0 0 30px rgba(245,179,1,.55)}
.row.won::after{content:'';position:absolute;top:0;bottom:0;width:130px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);animation:sheen 2.6s ease-in-out infinite}
@keyframes sheen{from{left:-150px}to{left:110%}}
.row.won .rank{background:linear-gradient(135deg,#f5b301,#ff8a00);border-color:#fff;font-size:36px}
.row.won .vt b{color:var(--gold2)}
.row.won .bar i{background:linear-gradient(90deg,#f5b301,#ff8a00)}
.winTag.big{font-size:24px;background:linear-gradient(90deg,#f5b301,#ffd34d);color:#4a3200;border:3px solid #fff;animation:glow 1.2s infinite alternate}
@keyframes glow{from{box-shadow:0 0 8px rgba(245,179,1,.5)}to{box-shadow:0 0 26px rgba(245,179,1,.95)}}
/* DUEL (head-to-head, ≤2 candidates) */
#list.duel{flex-direction:row;align-items:stretch;gap:28px;justify-content:center}
.duelCard{flex:1;max-width:760px;background:linear-gradient(180deg,rgba(26,36,76,.96),rgba(13,19,44,.96));border:3px solid rgba(255,255,255,.12);border-radius:28px;display:flex;flex-direction:column;align-items:center;padding:34px 30px 28px;position:relative;overflow:hidden;animation:rowIn .6s cubic-bezier(.2,.9,.25,1.15) both;animation-delay:var(--d,0ms)}
.duelCard.lead{border-color:var(--gold);box-shadow:0 0 40px rgba(245,179,1,.4)}
.duelCard img,.duelCard .av{width:220px;height:220px;border-radius:50%;object-fit:cover;border:6px solid rgba(255,255,255,.25);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.duelCard.lead img{border-color:var(--gold)}
.duelCard .av{display:flex;align-items:center;justify-content:center;font-size:110px;font-weight:800;color:#fff;background:linear-gradient(135deg,#3b5bff,#0a7a3d)}
.duelCard h3{font-size:46px;font-weight:800;margin-top:18px;text-align:center;line-height:1.2}
.duelCard .vv{font-size:84px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.duelCard.lead .vv{color:var(--gold2);text-shadow:0 0 24px rgba(245,179,1,.6)}
.duelCard .pp{font-size:24px;color:var(--mut);font-weight:700}
.duelCard .dbar{width:100%;height:14px;background:rgba(255,255,255,.1);border-radius:99px;margin-top:14px;overflow:hidden}
.duelCard .dbar i{display:block;height:100%;background:linear-gradient(90deg,#3b82f6,#93c5fd);animation:barGrow 1.2s ease both}
.duelCard.lead .dbar i{background:linear-gradient(90deg,#f5b301,#22c55e)}
#vsBadge{align-self:center;min-width:130px;height:130px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd34d,#b45309);color:#231a00;font-size:52px;font-weight:800;display:flex;align-items:center;justify-content:center;border:5px solid #fff;box-shadow:0 0 40px rgba(245,179,1,.7);animation:pulse 1.6s infinite;z-index:2}
#marginLine{text-align:center;font-size:26px;font-weight:800;color:var(--gold2);margin-top:4px}
/* TICKER */
#ticker{height:42px;margin:8px 48px 0;background:rgba(0,0,0,.5);border:1px solid rgba(245,179,1,.3);border-radius:14px;overflow:hidden;white-space:nowrap;display:flex;align-items:center}
#tickTxt{display:inline-block;padding-left:100%;animation:tick 30s linear infinite;font-size:22px;font-weight:700;color:#ffe9a8}
@keyframes tick{to{transform:translateX(-100%)}}
/* BOTTOM */
#bottom{height:78px;margin:10px 48px 14px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.12);border-radius:18px;display:flex;align-items:center;gap:16px;padding:0 24px;color:#fff}
#prog{flex:1;height:14px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden}
#prog i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#d21f26,#f5b301,#22c55e);box-shadow:0 0 12px rgba(245,179,1,.8)}
#bottom .t{font-size:20px;font-weight:700;white-space:nowrap;color:#dbe3ff}
#bottom select,#bottom button{font-size:18px;font-weight:700;padding:8px 14px;border-radius:10px;border:none;font-family:inherit}
#bottom select{max-width:360px;background:#1a2450;color:#fff}
#bottom button{background:#243a8f;color:#fff;cursor:pointer}
#bottom button.g{background:#0a7a3d}
body.obs #bottom .hideobs{display:none!important}
/* flower shower */
#petals{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:200}
.petal{position:absolute;top:-90px;animation-name:petalFall;animation-timing-function:linear;animation-fill-mode:forwards}
@keyframes petalFall{to{transform:translateY(1200px) rotate(540deg)}}
/* VICTORY CELEBRATION overlay */
#celebrate{position:absolute;inset:0;z-index:300;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:radial-gradient(800px 500px at 50% 40%,rgba(245,179,1,.28),transparent 70%),rgba(4,7,20,.96);opacity:0;transition:opacity .6s}
#celebrate.show{display:flex;opacity:1}
#celebrate .tro{font-size:150px;animation:bounce 1s ease infinite alternate}
@keyframes bounce{to{transform:translateY(-24px) scale(1.06)}}
#celebrate .w1{font-size:44px;font-weight:800;letter-spacing:8px;color:var(--gold2);margin-top:6px}
#celebrate img,#celebrate .av{width:250px;height:250px;border-radius:50%;object-fit:cover;border:8px solid var(--gold);box-shadow:0 0 60px rgba(245,179,1,.8);margin-top:18px}
#celebrate .av{display:flex;align-items:center;justify-content:center;font-size:120px;font-weight:800;color:#fff;background:linear-gradient(135deg,#3b5bff,#0a7a3d)}
#celebrate .wn{font-size:76px;font-weight:800;margin-top:16px}
#celebrate .wc{font-size:34px;color:var(--mut);font-weight:700;margin-top:6px}
#celebrate .wt{font-size:44px;font-weight:800;color:var(--gold2);margin-top:14px;animation:pulse 1.2s infinite}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <div id="goldline"></div>
  <div id="fx"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
  <div id="top">
    <div id="logo">🌳</div>
    <div><h1>नेपाली कांग्रेस <em>• १५औं महाधिवेशन</em></h1><p id="subLine">केन्द्रीय कार्यसमिति निर्वाचन — Live Vote Count</p></div>
    <div id="liveBox"><div id="liveBadge"><i></i>LIVE</div><div id="slideNo">1 / 80</div></div>
  </div>
  <div id="catbar">
    <div id="catTx"><div id="catOver">—</div><h2 id="catTitle">—</h2><div id="catU"></div></div>
    <span class="pill seat" id="seatPill">—</span>
    <span class="pill cand" id="candPill">—</span>
    <span class="pill vote" id="votePill">—</span>
    <span class="pill cast" id="castPill">—</span>
  </div>
  <div id="list"></div>
  <div id="ticker"><span id="tickTxt">🌳 नेपाली कांग्रेस १५औं महाधिवेशन •</span></div>
  <div id="bottom">
    <div id="prog"><i id="progBar"></i></div>
    <span class="t" id="pageInfo">—</span>
    <select id="catSel" class="hideobs"></select>
    <button id="prevBtn" class="hideobs">◀</button>
    <button id="playBtn" class="g">⏸</button>
    <button id="nextBtn" class="hideobs">▶</button>
    <a href="admin.html" target="_blank" class="hideobs" style="color:#f5b301;font-size:18px;font-weight:800;text-decoration:none">⚙ Admin</a>
  </div>
  <div id="petals"></div>
  <div id="celebrate"><div class="tro">🏆</div><div class="w1">★ विजयी घोषणा ★</div><div id="celPh"></div><div class="wn" id="celName">—</div><div class="wc" id="celCat">—</div><div class="wt">🎉 निर्विरोध निर्वाचित 🎉</div></div>
</div></div>

<script>
function fit(){const sc=Math.min(innerWidth/1920,innerHeight/1080);document.getElementById('stage').style.transform=`scale(${sc})`;}
addEventListener('resize',fit);fit();
(function(){const fx=document.getElementById('fx');
  for(let i=0;i<22;i++){const s=document.createElement('span');s.className='sp';const sz=3+Math.random()*6;
    s.style.cssText=`left:${Math.random()*1920}px;top:${300+Math.random()*780}px;width:${sz}px;height:${sz}px;background:${Math.random()>.5?'#f5b301':'#fff'};opacity:.55;animation-duration:${6+Math.random()*9}s;animation-delay:${Math.random()*8}s`;
    fx.appendChild(s);}})();

const qs=new URLSearchParams(location.search);
const PER=parseInt(qs.get('per')||'6',10)||6;
let intervalSec=parseInt(qs.get('interval')||'12',10)||12;
let playing=qs.get('play')!=='0';
let votes={};
try{Object.assign(votes,JSON.parse(localStorage.getItem('nc_votes')||'{}'))}catch(e){}
async function loadRemote(){
  try{const r=await fetch('votes.json?t='+Date.now(),{cache:'no-store'});if(r.ok){const j=await r.json();const hasLocal=!!localStorage.getItem('nc_votes');for(const k in j){if(!hasLocal)votes[k]=j[k];else votes[k]=Math.max(votes[k]||0,j[k]);}}}catch(e){}
}
const cats=[];const map=new Map();
for(const c of CANDIDATES){if(!map.has(c.cat))map.set(c.cat,{cat:c.cat,seats:c.seats||1,cands:[]});map.get(c.cat).cands.push(c);}
for(const v of map.values())cats.push(v);
let pages=[];
function buildPages(){
  pages=[];
  cats.forEach((c,ci)=>{
    let arr=[...c.cands].sort((a,b)=>(votes[b.id]||0)-(votes[a.id]||0));
    const tp=Math.max(1,Math.ceil(arr.length/PER));
    for(let p=0;p<tp;p++)pages.push({catIdx:ci,page:p,totalPages:tp,list:arr.slice(p*PER,(p+1)*PER),cat:c.cat,seats:c.seats,full:arr});
  });
}
let pi=parseInt(qs.get('slide')||'0',10)||0;
const $=id=>document.getElementById(id);
const DELEGATES=7255, VOTES_CAST=7039;
const TURNOUT_PCT=(VOTES_CAST/DELEGATES*100).toFixed(2);
$('subLine').textContent=`केन्द्रीय कार्यसमिति निर्वाचन — Live Vote Count • ${DELEGATES.toLocaleString()} प्रतिनिधि • ${VOTES_CAST.toLocaleString()} मत (${TURNOUT_PCT}% मतदान)`;
const lastVotes={};const lastOrder={};let lastSlideKey='';let lastCelebKey='';
function countUp(elm,from,to){
  if(from===to){elm.textContent=to.toLocaleString();return;}
  const t0=performance.now(),d=900;
  (function f(t){const p=Math.min(1,(t-t0)/d),e=1-Math.pow(1-p,3);
    elm.textContent=Math.round(from+(to-from)*e).toLocaleString();
    if(p<1)requestAnimationFrame(f);})(t0);
}
function renderSel(){$('catSel').innerHTML=cats.map((c,i)=>`<option value="${i}">${i+1}. ${c.cat} (${c.cands.length})</option>`).join('');}
const initials=n=>(n||'?').trim().charAt(0);
function render(){
  if(pi<0)pi=pages.length-1;if(pi>=pages.length)pi=0;
  const pg=pages[pi],c=cats[pg.catIdx];
  const slideKey=pg.catIdx+'-'+pg.page;
  $('catSel').value=pg.catIdx;
  const ct=$('catTitle');ct.style.animation='none';void ct.offsetWidth;ct.style.animation='';
  const cu=$('catU');cu.style.animation='none';void cu.offsetWidth;cu.style.animation='';
  $('catOver').textContent=`पद-समूह ${pg.catIdx+1} / ${cats.length}${pg.totalPages>1?` • पेज ${pg.page+1}/${pg.totalPages}`:''}${c.cands.some(x=>x.unopposed)?' 🏆':''}`;
  ct.textContent=(pg.catIdx+1)+'. '+pg.cat;
  $('seatPill').textContent=pg.seats+' पद';
  $('candPill').textContent=c.cands.length+' उम्मेदवार';
  const total=c.cands.reduce((a,x)=>a+(votes[x.id]||0),0);
  $('votePill').textContent='जम्मा '+total.toLocaleString()+' भोट';
  (function(){const elm=$('castPill'),to=VOTES_CAST,t0=performance.now(),d=1400;
    (function f(t){const p=Math.min(1,(t-t0)/d),e=1-Math.pow(1-p,3);
      elm.textContent=`🗳️ ${Math.round(to*e).toLocaleString()} मत खस्यो`;
      if(p<1)requestAnimationFrame(f);})(t0);})();
  $('slideNo').textContent=(pg.catIdx+1)+' / '+cats.length+(pg.totalPages>1?` • पेज ${pg.page+1}/${pg.totalPages}`:'');
  $('pageInfo').textContent=`${pg.catIdx+1}/${cats.length}`+(pg.totalPages>1?` • ${pg.page+1}/${pg.totalPages}`:'')+` • ${total>0?'अग्रता: '+(pg.full[0]?pg.full[0].name:'—'):'मतगणना बाँकी'}`;
  const listEl=$('list');
  // DUEL mode: 2-or-fewer candidates on a single screen
  if(c.cands.length<=2&&pg.totalPages===1){
    listEl.classList.add('duel');
    const mx=Math.max(1,...pg.full.map(x=>votes[x.id]||0));
    const w=pg.full[0]?votes[pg.full[0].id]||0:0, r=pg.full[1]?votes[pg.full[1].id]||0:0;
    const card=(x,i)=>{const v=votes[x.id]||0,pct=Math.round(v/mx*100),isL=total>0&&i===0;
      const ph=x.photo?`<img loading="lazy" src="${x.photo}" onerror="this.outerHTML='<div class=av>${initials(x.name)}</div>'">`:`<div class="av">${initials(x.name)}</div>`;
      return `<div class="duelCard ${isL?'lead':''}" style="--d:${i*140}ms">${ph}<h3>${x.ballot}. ${x.name}${x.unopposed?' 🏆':''}</h3>
      <div class="vv" data-vid="${x.id}" data-v="${v}">0</div><div class="pp">भोट • ${pct}%${x.unopposed?' • 🎉 विजयी':''}</div>
      <div class="dbar"><i style="--w:${x.unopposed?100:pct}%"></i></div></div>`;};
    listEl.innerHTML=card(pg.full[0],0)+(pg.full[1]?`<div id="vsBadge">VS</div>`+card(pg.full[1],1):'')
      +((total>0&&pg.full[1])?`<div id="marginLine"></div>`:'');
    const ml=$('marginLine');
    if(ml)ml.textContent=`⚡ ${pg.full[0].name} ${Math.abs(w-r).toLocaleString()} मतले अगाडि`;
  }else{
    listEl.classList.remove('duel');
    const mx=Math.max(1,...pg.list.map(x=>votes[x.id]||0));
    const rankOf=id=>pg.full.findIndex(x=>x.id===id)+1;
    const prev=lastOrder[pg.catIdx]||[];
    listEl.innerHTML=pg.list.map((x,i)=>{
      const v=votes[x.id]||0,pct=Math.round(v/mx*100),r=rankOf(x.id);
      const lead=total>0&&r<=pg.seats, won=!!x.unopposed;
      let mv='';
      if(total>0&&prev.length){const o=prev.indexOf(x.id);
        if(o===-1||o===r-1)mv='<span class="mv same">•</span>';
        else if(o>r-1)mv=`<span class="mv up">▲${o-(r-1)}</span>`;
        else mv=`<span class="mv dn">▼${(r-1)-o}</span>`;}
      const ph=x.photo?`<img loading="lazy" src="${x.photo}" onerror="this.outerHTML='<div class=av>${initials(x.name)}</div>'">`:`<div class="av">${initials(x.name)}</div>`;
      const vt=won?`<div class="vt"><b>🏆</b><br><span>विजयी • निर्विरोध</span></div>`
        :`<div class="vt"><b data-vid="${x.id}" data-v="${v}">0</b><br><span>भोट • ${pct}%</span></div>`;
      return `<div class="row ${lead&&!won?'lead':''} ${won?'won':''}" style="--d:${i*85}ms"><div class="rank">${won?'🏆':r}</div>${ph}
      <div class="nm"><b>${x.ballot}. ${x.name}${mv}${(lead&&!won)?'<span class="winTag">★ Leading</span>':''}${won?'<span class="winTag big">🎉 विजयी • निर्विरोध निर्वाचित</span>':''}</b></div>
      ${vt}<div class="bar"><i style="--w:${won?100:pct}%"></i></div></div>`;
    }).join('');
  }
  document.querySelectorAll('#list [data-vid]').forEach(b=>{
    const id=b.dataset.vid,to=+b.dataset.v;
    const from=(slideKey===lastSlideKey)?(lastVotes[id]||0):0;
    countUp(b,from,to);lastVotes[id]=to;
  });
  lastSlideKey=slideKey;
  if(total>0)lastOrder[pg.catIdx]=pg.full.map(x=>x.id);
  const hot=[...cats].map(cc=>({cc,t:cc.cands.reduce((a,x)=>a+(votes[x.id]||0),0)}))
    .filter(o=>o.t>0).sort((a,b)=>b.t-a.t).slice(0,3)
    .map(o=>{const f=[...o.cc.cands].sort((a,b)=>(votes[b.id]||0)-(votes[a.id]||0));return `${o.cc.cat.split('(')[0].trim()}: ${f[0].name} ${votes[f[0].id].toLocaleString()} 🥇`;}).join(' • ');
  $('tickTxt').textContent=`🌳 नेपाली कांग्रेस १५औं महाधिवेशन • निर्वाचन समिति: ${DELEGATES.toLocaleString()} प्रतिनिधिमध्ये ${VOTES_CAST.toLocaleString()} मत (${TURNOUT_PCT}% मतदान)${hot?' • 🔥 '+hot:''} • `;
  if(pg.list.some(x=>x.unopposed))startPetals();else stopPetals();
  // victory celebration splash (once per winning slide)
  if(slideKey!==lastCelebKey){lastCelebKey=slideKey;const w=pg.list.find(x=>x.unopposed);if(w)celebrate(w,pg.cat);}
}
let petalTimer=null;
function stopPetals(){if(petalTimer){clearInterval(petalTimer);petalTimer=null;}const b=$('petals');if(b)b.innerHTML='';}
function startPetals(){
  stopPetals();
  const box=$('petals');if(!box)return;
  const flowers=['🌸','🌺','🌼','🌷','💮','🏵️','🌹','🌻'];
  petalTimer=setInterval(()=>{
    const s=document.createElement('span');s.className='petal';
    s.textContent=flowers[Math.floor(Math.random()*flowers.length)];
    s.style.left=(Math.random()*1850)+'px';
    s.style.fontSize=(28+Math.random()*40)+'px';
    s.style.animationDuration=(4+Math.random()*3.5)+'s';
    box.appendChild(s);setTimeout(()=>s.remove(),8000);
    if(box.children.length>90)box.firstChild.remove();
  },220);
}
let celebTimer=null;
function celebrate(w,cat){
  hideCeleb(true);
  $('celPh').innerHTML=w.photo?`<img src="${w.photo}" onerror="this.outerHTML='<div class=av>${initials(w.name)}</div>'">`:`<div class="av">${initials(w.name)}</div>`;
  $('celName').textContent=w.name;
  $('celCat').textContent=cat;
  $('celebrate').classList.add('show');
  startPetals();
  celebTimer=setTimeout(()=>hideCeleb(),4500);
}
function hideCeleb(instant){
  if(celebTimer){clearTimeout(celebTimer);celebTimer=null;}
  const c=$('celebrate');if(!c)return;
  if(instant){c.classList.remove('show');return;}
  c.style.opacity='0';setTimeout(()=>{c.classList.remove('show');c.style.opacity='';},600);
}
let el=0;
setInterval(()=>{if(!playing)return;el+=0.2;$('progBar').style.width=Math.min(100,el/intervalSec*100)+'%';if(el>=intervalSec){el=0;pi++;render();}},200);
function go(d){el=0;hideCeleb(true);if(d===1||d===-1){pi+=d;render();}else{pi=pages.findIndex(p=>p.catIdx===d&&p.page===0);if(pi<0)pi=0;render();}}
function tog(){playing=!playing;el=0;$('playBtn').textContent=playing?'⏸':'▶';}
$('prevBtn').onclick=()=>go(-1);$('nextBtn').onclick=()=>go(1);$('playBtn').onclick=tog;
$('catSel').onchange=e=>{go(parseInt(e.target.value,10));};
document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1);if(e.key===' '){e.preventDefault();tog();}if(e.key==='Escape')hideCeleb();});
if(qs.get('obs')==='1')document.body.classList.add('obs');
window.addEventListener('storage',e=>{if(e.key==='nc_votes'){try{votes=JSON.parse(localStorage.getItem('nc_votes')||'{}')}catch(_){}buildPages();render();}});
buildPages();renderSel();render();
$('playBtn').textContent=playing?'⏸':'▶';
loadRemote().then(()=>{buildPages();render();});
setInterval(async()=>{const b=JSON.stringify(votes);await loadRemote();try{const l=JSON.parse(localStorage.getItem('nc_votes')||'{}');for(const k in l)votes[k]=l[k];}catch(e){}if(JSON.stringify(votes)!==b){buildPages();if(pi>=pages.length)pi=0;render();}},5000);
</script>
