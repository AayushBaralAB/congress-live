<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NC 15th Mahadhiveshan – Live Vote Count (16:9)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="candidates.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#000;font-family:'Noto Sans Devanagari',sans-serif;overflow:hidden}
/* outside wrapper centers 16:9 stage */
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
#stage{width:1920px;height:1080px;flex-shrink:0;transform-origin:center center;background:linear-gradient(180deg,#0b1e5b 0%,#122c8a 30%,#f2f4f9 30.2%);color:#16213a;display:flex;flex-direction:column;position:relative}
/* TOP BAR */
#top{height:150px;display:flex;align-items:center;gap:20px;padding:22px 48px;color:#fff}
#logo{width:96px;height:96px;background:#fff;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:58px}
#top h1{font-size:52px;font-weight:800;line-height:1.05}
#top p{font-size:26px;opacity:.92;font-weight:600}
#liveBox{margin-left:auto;text-align:right}
#liveBadge{background:#d21f26;color:#fff;font-weight:800;font-size:34px;padding:8px 30px;border-radius:999px;display:inline-flex;align-items:center;gap:12px}
#liveBadge i{width:20px;height:20px;background:#fff;border-radius:50%;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
#slideNo{font-size:28px;font-weight:700;margin-top:8px;opacity:.95}
/* CATEGORY BAR */
#catbar{margin:18px 48px 0;background:#fff;border-radius:24px;border-left:16px solid #d21f26;padding:20px 34px;display:flex;align-items:center;gap:24px;box-shadow:0 6px 20px rgba(0,0,0,.15)}
#catbar h2{font-size:48px;font-weight:800;color:#102a7a;line-height:1.15;flex:1}
.pill{font-size:26px;font-weight:800;padding:10px 26px;border-radius:999px;white-space:nowrap}
.pill.seat{background:#e7f8ee;color:#0a6a35;border:3px solid #0a7a3d}
.pill.cand{background:#eef2ff;color:#1e2f8f;border:3px solid #1e2f8f}
.pill.vote{background:#fff1f1;color:#b3121a;border:3px solid #d21f26}
/* LIST */
#list{flex:1;margin:18px 48px;display:flex;flex-direction:column;gap:14px;justify-content:flex-start}
.row{background:#fff;border-radius:20px;display:flex;align-items:center;gap:22px;padding:12px 26px 12px 14px;box-shadow:0 4px 14px rgba(10,20,60,.12);border:4px solid transparent;position:relative;overflow:hidden}
.row.lead{border-color:#0a7a3d;background:linear-gradient(90deg,#f0fdf4,#fff)}
.row .rank{min-width:78px;height:78px;border-radius:50%;background:#102a7a;color:#fff;font-size:40px;font-weight:800;display:flex;align-items:center;justify-content:center}
.row.lead .rank{background:#0a7a3d}
.row img,.row .av{width:92px;height:92px;border-radius:18px;object-fit:cover;background:#dbe3f5;flex-shrink:0}
.row .av{display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:800;color:#fff;background:linear-gradient(135deg,#102a7a,#0a7a3d)}
.row .nm{flex:1;min-width:0}
.row .nm b{font-size:38px;font-weight:800;line-height:1.15;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm span{font-size:24px;color:#66739a;font-weight:600}
.row .bar{position:absolute;left:0;bottom:0;height:10px;background:#e7ecf6;width:100%}
.row .bar i{display:block;height:100%;background:#3b82f6}
.row.lead .bar i{background:#22c55e}
.row .vt{text-align:right;min-width:230px}
.row .vt b{font-size:56px;font-weight:800;color:#102a7a;line-height:1}
.row.lead .vt b{color:#0a6a35}
.row .vt span{font-size:24px;color:#66739a;font-weight:700}
.winTag{font-size:22px;font-weight:800;background:#fef3c7;color:#92400e;border:2px solid #f5b301;border-radius:999px;padding:2px 16px;margin-left:12px;vertical-align:middle}
/* WINNER (निर्विरोध) — golden victory card */
.row.won{border-color:#f5b301;background:linear-gradient(90deg,#fffbe6,#fff7d6,#fff);box-shadow:0 0 28px rgba(245,179,1,.55)}
.row.won .rank{background:linear-gradient(135deg,#f5b301,#ff8a00);font-size:44px}
.row.won .vt b{color:#b45309}
.winTag.big{font-size:30px;background:linear-gradient(90deg,#f5b301,#ffd34d);color:#5a3c00;border:3px solid #b45309;box-shadow:0 0 14px rgba(245,179,1,.7);animation:glow 1.2s infinite alternate}
@keyframes glow{from{box-shadow:0 0 8px rgba(245,179,1,.5)}to{box-shadow:0 0 22px rgba(245,179,1,.95)}}
/* flower shower */
#petals{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:200}
.petal{position:absolute;top:-90px;animation-name:petalFall;animation-timing-function:linear;animation-fill-mode:forwards}
@keyframes petalFall{to{transform:translateY(1200px) rotate(540deg)}}
/* BOTTOM */
#bottom{height:96px;margin:0 48px 22px;background:#0b1530;border-radius:20px;display:flex;align-items:center;gap:18px;padding:0 28px;color:#fff}
#prog{flex:1;height:16px;background:#2a3a6e;border-radius:99px;overflow:hidden}
#prog i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#d21f26,#f5b301,#22c55e)}
#bottom .t{font-size:24px;font-weight:700;white-space:nowrap}
#bottom select,#bottom button{font-size:22px;font-weight:700;padding:10px 18px;border-radius:12px;border:none;font-family:inherit}
#bottom select{max-width:420px}
#bottom button{background:#243a8f;color:#fff;cursor:pointer}
#bottom button.g{background:#0a7a3d}
body.obs #bottom .hideobs{display:none!important}
/* empty msg */
#empty{font-size:34px;text-align:center;padding:60px;color:#445}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <div id="top">
    <div id="logo">🌳</div>
    <div><h1>नेपाली कांग्रेस • १५औं महाधिवेशन</h1><p>केन्द्रीय कार्यसमिति निर्वाचन — Live Vote Count</p></div>
    <div id="liveBox"><div id="liveBadge"><i></i>LIVE</div><div id="slideNo">1 / 80</div></div>
  </div>
  <div id="catbar">
    <h2 id="catTitle">—</h2>
    <span class="pill seat" id="seatPill">—</span>
    <span class="pill cand" id="candPill">—</span>
    <span class="pill vote" id="votePill">—</span>
  </div>
  <div id="list"></div>
  <div id="bottom">
    <div id="prog"><i id="progBar"></i></div>
    <span class="t" id="pageInfo">—</span>
    <select id="catSel" class="hideobs"></select>
    <button id="prevBtn" class="hideobs">◀</button>
    <button id="playBtn" class="g">⏸</button>
    <button id="nextBtn" class="hideobs">▶</button>
    <a href="admin.html" target="_blank" class="hideobs" style="color:#f5b301;font-size:22px;font-weight:800;text-decoration:none">⚙ Admin</a>
  </div>
  <div id="petals"></div>
</div></div>

<script>
// ---- fit 16:9 stage to window ----
function fit(){
  const s=1920,h=1080;
  const sc=Math.min(innerWidth/s,innerHeight/h);
  document.getElementById('stage').style.transform=`scale(${sc})`;
}
addEventListener('resize',fit); fit();

const qs=new URLSearchParams(location.search);
const PER=parseInt(qs.get('per')||'7',10)||7; // rows per screen - simple & clear
let intervalSec=parseInt(qs.get('interval')||'12',10)||12;
let playing=qs.get('play')!=='0';
let votes={};
try{Object.assign(votes,JSON.parse(localStorage.getItem('nc_votes')||'{}'))}catch(e){}
async function loadRemote(){
  try{const r=await fetch('votes.json?t='+Date.now(),{cache:'no-store'});if(r.ok){const j=await r.json();const hasLocal=!!localStorage.getItem('nc_votes');for(const k in j){if(!hasLocal)votes[k]=j[k];else votes[k]=Math.max(votes[k]||0,j[k]);}}}catch(e){}
}
// group categories
const cats=[];const map=new Map();
for(const c of CANDIDATES){if(!map.has(c.cat))map.set(c.cat,{cat:c.cat,seats:c.seats||1,cands:[]});map.get(c.cat).cands.push(c);}
for(const v of map.values())cats.push(v);
// build pages: each page = one screen (max PER rows)
let pages=[]; // {catIdx,page,totalPages,list,cat,seats}
function buildPages(){
  pages=[];
  cats.forEach((c,ci)=>{
    let arr=[...c.cands].sort((a,b)=>(votes[b.id]||0)-(votes[a.id]||0));
    const tp=Math.max(1,Math.ceil(arr.length/PER));
    for(let p=0;p<tp;p++)pages.push({catIdx:ci,page:p,totalPages:tp,list:arr.slice(p*PER,(p+1)*PER),cat:c.cat,seats:c.seats,full:arr});
  });
}
let pi=parseInt(qs.get('slide')||'0',10)||0;
const $=id=>document.getElementById(id);
function renderSel(){
  $('catSel').innerHTML=cats.map((c,i)=>`<option value="${i}">${i+1}. ${c.cat}</option>`).join('');
}
function render(){
  if(pi<0)pi=pages.length-1;if(pi>=pages.length)pi=0;
  const pg=pages[pi],c=cats[pg.catIdx];
  $('catSel').value=pg.catIdx;
  $('catTitle').textContent=(pg.catIdx+1)+'. '+pg.cat+(c.cands.some(x=>x.unopposed)?' 🏆':'');
  $('seatPill').textContent=pg.seats+' पद';
  $('candPill').textContent=c.cands.length+' उम्मेदवार';
  const total=c.cands.reduce((a,x)=>a+(votes[x.id]||0),0);
  $('votePill').textContent='जम्मा '+total.toLocaleString()+' भोट';
  $('slideNo').textContent=(pg.catIdx+1)+' / '+cats.length+(pg.totalPages>1?` • पेज ${pg.page+1}/${pg.totalPages}`:'');
  $('pageInfo').textContent=`${pg.catIdx+1}/${cats.length}`+(pg.totalPages>1?` • ${pg.page+1}/${pg.totalPages}`:'')+` • ${total>0?'अग्रता: '+(pg.full[0]?pg.full[0].name:'—'):'मतगणना बाँकी'}`;
  const max=Math.max(1,...pg.list.map(x=>votes[x.id]||0));
  // global rank lookup
  const rankOf=id=>pg.full.findIndex(x=>x.id===id)+1;
  $('list').innerHTML=pg.list.map(x=>{
    const v=votes[x.id]||0,pct=Math.round(v/max*100),r=rankOf(x.id);
    const lead=total>0&&r<=pg.seats;
    const won=!!x.unopposed;
    const ph=x.photo?`<img loading="lazy" src="${x.photo}" onerror="this.outerHTML='<div class=av>${(x.name||'?').trim().charAt(0)}</div>'">`:`<div class="av">${(x.name||'?').trim().charAt(0)}</div>`;
    const vt=won?`<div class="vt"><b>🏆</b><br><span>विजयी • निर्विरोध</span></div>`
      :`<div class="vt"><b>${v.toLocaleString()}</b><br><span>भोट • ${pct}%</span></div>`;
    return `<div class="row ${lead&&!won?'lead':''} ${won?'won':''}"><div class="rank">${won?'🏆':r}</div>${ph}
    <div class="nm"><b>${x.ballot}. ${x.name}${(lead&&!won)?'<span class="winTag">★ Leading</span>':''}${won?'<span class="winTag big">🎉 विजयी • निर्विरोध निर्वाचित</span>':''}</b></div>
    ${vt}
    <div class="bar"><i style="width:${won?100:pct}%"></i></div></div>`;
  }).join('');
  // flower shower for निर्विरोध winners
  if(pg.list.some(x=>x.unopposed))startPetals();else stopPetals();
}
// ---- flower shower ----
let petalTimer=null;
function stopPetals(){if(petalTimer){clearInterval(petalTimer);petalTimer=null;}const b=$('petals');if(b)b.innerHTML='';}
function startPetals(){
  stopPetals();
  const box=$('petals');if(!box)return;
  const flowers=['🌸','🌺','🌼','🌷','💮','🏵️','🌹','🌻'];
  petalTimer=setInterval(()=>{
    const s=document.createElement('span');
    s.className='petal';
    s.textContent=flowers[Math.floor(Math.random()*flowers.length)];
    s.style.left=(Math.random()*1850)+'px';
    s.style.fontSize=(28+Math.random()*40)+'px';
    s.style.animationDuration=(4+Math.random()*3.5)+'s';
    box.appendChild(s);
    setTimeout(()=>s.remove(),8000);
    if(box.children.length>90)box.firstChild.remove();
  },220);
}
let el=0;
setInterval(()=>{if(!playing)return;el+=0.2;$('progBar').style.width=Math.min(100,el/intervalSec*100)+'%';if(el>=intervalSec){el=0;pi++;render();}},200);
function go(d){el=0;if(d===1||d===-1){pi+=d;render();}else{pi=pages.findIndex(p=>p.catIdx===d&&p.page===0);if(pi<0)pi=0;render();}}
function tog(){playing=!playing;el=0;$('playBtn').textContent=playing?'⏸':'▶';}
$('prevBtn').onclick=()=>go(-1);$('nextBtn').onclick=()=>go(1);$('playBtn').onclick=tog;
$('catSel').onchange=e=>{go(parseInt(e.target.value,10));};
document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1);if(e.key===' '){e.preventDefault();tog();}});
if(qs.get('obs')==='1')document.body.classList.add('obs');
window.addEventListener('storage',e=>{if(e.key==='nc_votes'){try{votes=JSON.parse(localStorage.getItem('nc_votes')||'{}')}catch(_){}buildPages();render();}});
buildPages();renderSel();render();
$('playBtn').textContent=playing?'⏸':'▶';
loadRemote().then(()=>{buildPages();render();});
setInterval(async()=>{const b=JSON.stringify(votes);await loadRemote();try{const l=JSON.parse(localStorage.getItem('nc_votes')||'{}');for(const k in l)votes[k]=l[k];}catch(e){}if(JSON.stringify(votes)!==b){buildPages();if(pi>=pages.length)pi=0;render();}},5000);
</script>
</body>
</html>
